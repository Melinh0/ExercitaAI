[project]
name = "llm-api-fastapi"
version = "1.0.0"
description = "API FastAPI para RAG com ChromaDB e Ollama"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "markdown>=3.5.0",
    "pytesseract>=0.3.13",
    "cachetools>=5.5.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
link-mode = "copy"

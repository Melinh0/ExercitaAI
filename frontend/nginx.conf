    }

    location /static/images/ {
        proxy_pass http://backend:5000/static/images/;
        proxy_set_header Host $host;
    }

    location /static/whiteboards/ {
        proxy_pass http://backend:5000/static/whiteboards/;
        proxy_set_header Host $host;
    }

    location /whiteboard_image/ {
        proxy_pass http://backend:5000/whiteboard_image/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/topic/[^/]+/(files|material_files)$ {
        proxy_pass http://backend:5000$request_uri;
        proxy_set_header Host $host;

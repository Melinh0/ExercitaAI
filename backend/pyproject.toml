[project]
name = "backend-flask"
version = "1.0.0"
description = "Backend Flask para resolução de questões"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.2",
    "flask-login==0.6.3",
    "flask-sqlalchemy==3.1.1",
    "PyMuPDF==1.27.2",
    "markdown==3.10.2",
    "python-multipart==0.0.9",
    "pyautogui==0.9.54",
    "requests==2.33.0",
    "Pillow==12.1.1",
    "python-dotenv>=1.0.0",
    "pytesseract>=0.3.13",
    "opencv-python",
    "python-docx>=1.1.0",
    "Werkzeug==3.1.3",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
link-mode = "copy"
